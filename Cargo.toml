[workspace]
resolver = "2"
members = ["contracts/spora_escrow"]

[workspace.dependencies]
soroban-sdk = "21.7.6"

# `soroban-env-host 21.2.1` declares `ed25519-dalek = ">=2.0.0"`, an unbounded
# requirement. Cargo therefore resolves it to 3.0.0, which reshaped the
# `CryptoRng` trait, and the host's own `testutils.rs` then fails to compile:
#
#   the trait bound `ChaCha20Rng: ed25519_dalek::rand_core::CryptoRng`
#   is not satisfied
#
# Nothing in this workspace uses ed25519-dalek directly; it is declared here
# only to put a ceiling on that transitive resolution. Cargo.lock pins the
# exact version, but the ceiling keeps a future `cargo update` from silently
# reintroducing the break.
ed25519-dalek = "2.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# `release-with-logs` keeps the diagnostic log sink so `stellar contract invoke`
# surfaces panic messages during testnet debugging. Never deploy this profile.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
